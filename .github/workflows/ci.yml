# The five required checks (docs/agents/build-workflow.md, "CI gates").
# typecheck, lint, test and build run on the code; e2e runs the browser tests
# against the PR's own Vercel preview (or production after a merge to main).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # Vitest, never `bun test` (ADR 0006).
      - run: bun run test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      statuses: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium

      # Vercel reports each deployment as a "Vercel" commit status (it doesn't
      # create GitHub Deployments for this project). Wait for this commit's to
      # succeed, then test the PR's preview URL from the Vercel bot's PR comment
      # (the branch alias, which points at this commit once its status is
      # success), or production after a merge to main.
      - name: Wait for the Vercel deployment of this commit
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PRODUCTION_URL: https://utsavvy.vercel.app
        run: |
          for attempt in $(seq 1 90); do
            state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/statuses?per_page=100" \
              --jq '[.[] | select(.context == "Vercel")][0].state // empty')
            echo "Attempt ${attempt}: Vercel deployment of ${SHA} is ${state:-not reported yet}"
            if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
              echo "::error::The Vercel deployment of ${SHA} failed."
              exit 1
            fi
            if [ "$state" = "success" ]; then
              if [ -z "$PR_NUMBER" ]; then
                echo "url=${PRODUCTION_URL}" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              # The bot comment starts with "[vc]: #<hash>:<base64 JSON>" holding previewUrl.
              preview=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" \
                --jq '[.[] | select(.user.login == "vercel[bot]")][0].body // empty' \
                | head -n 1 | sed -E 's/^\[vc\]: #[^:]*:([^ ]*).*/\1/' \
                | node -e 'let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
                    try {
                      const meta = JSON.parse(Buffer.from(s.trim(), "base64").toString());
                      process.stdout.write(meta.projects.find((p) => p.name === "utsavvy")?.previewUrl ?? "");
                    } catch {}
                  });' || true)
              if [ -n "$preview" ]; then
                echo "url=https://${preview}" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "Deployed, but the Vercel bot comment has no preview URL yet"
            fi
            sleep 20
          done
          echo "::error::Timed out waiting for the Vercel deployment of ${SHA}."
          exit 1

      - run: bun run test:e2e
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: ${{ steps.deployment.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
          # Production never runs the stub model, so specs that expect its
          # canned replies skip themselves there.
          E2E_TARGET: ${{ github.event.pull_request.number && 'preview' || 'production' }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
