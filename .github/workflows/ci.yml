# The five required checks (docs/agents/build-workflow.md, "CI gates").
# typecheck, lint, test and build run on the code; e2e runs the browser tests
# against the PR's own Vercel preview (or production after a merge to main).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      # Vitest, never `bun test` (ADR 0006).
      - run: bun run test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium

      # Vercel reports each deployment through GitHub's Deployments API. Wait for
      # the one built from this commit to succeed, then test its URL.
      - name: Wait for the Vercel deployment of this commit
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ENVIRONMENT: ${{ github.event_name == 'pull_request' && 'Preview' || 'Production' }}
        run: |
          for attempt in $(seq 1 90); do
            statuses_url=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${SHA}&per_page=100" \
              --jq "[.[] | select(.environment | test(\"${ENVIRONMENT}\"; \"i\"))][0].statuses_url // empty")
            if [ -n "$statuses_url" ]; then
              status=$(gh api "$statuses_url" --jq '.[0] | "\(.state) \(.environment_url // .target_url // "")"')
              state=${status%% *}
              url=${status#* }
              echo "Attempt ${attempt}: ${ENVIRONMENT} deployment is ${state:-pending}"
              if [ "$state" = "success" ] && [ -n "$url" ]; then
                echo "url=${url}" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ "$state" = "failure" ] || [ "$state" = "error" ]; then
                echo "::error::The Vercel ${ENVIRONMENT} deployment of ${SHA} failed."
                exit 1
              fi
            else
              echo "Attempt ${attempt}: no ${ENVIRONMENT} deployment for ${SHA} yet"
            fi
            sleep 20
          done
          echo "::error::Timed out waiting for the Vercel ${ENVIRONMENT} deployment of ${SHA}."
          exit 1

      - run: bun run test:e2e
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: ${{ steps.deployment.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
